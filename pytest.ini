[pytest]
testpaths = tests/job_lifecycle tests/runtime_bugs tests/executors
python_files = test_*.py
# `grokpipe` (thư mục NGOÀI) để `import grokpipe.executors…` trỏ đúng gói trong,
# không phải thư mục cùng tên ở gốc repo.
pythonpath = tests/job_lifecycle grokpipe
addopts = -ra --strict-config --strict-markers
