<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SF Board</title>
  <link rel="stylesheet" href="/ui/board.css">
</head>

<body>

  <header>
    <h1>SF Board</h1>
    <span class="film" id="film"></span>
    <div class="tabs" id="tabs">
      <button data-v="script" class="on">Kịch bản</button>
      <button data-v="sf">Start frames</button>
    </div>
    <div class="stats" id="stats"></div>
    <select id="filter">
      <option value="all">Tất cả</option>
      <option value="pending">Chờ duyệt</option>
      <option value="revise">Cần sửa</option>
      <option value="approved">Đã duyệt</option>
      <option value="noimg">Chưa có ảnh</option>
      <option value="root">① Ảnh gốc cần chạy TRƯỚC (thẻ địa điểm + neo)</option>
    </select>
    <select id="vfilter" title="Lọc video theo trạng thái — chỉ hiện những dòng cần xử lý">
      <option value="all">Tất cả video</option>
      <option value="pending">⬜ Chưa duyệt</option>
      <option value="approved">✓ Đã duyệt</option>
      <option value="rejected">✕ Bị loại</option>
      <option value="novid">Chưa có video</option>
      <option value="multi">⧉ Nhiều bản — cần chọn</option>
      <option value="err">⚠ Lỗi khi tạo</option>
      <option value="gap">⏱ Trống thời lượng</option>
      <option value="stale">⚠ Prompt lệch thoại</option>
      <option value="note">📝 Có ghi chú cần fix</option>
      <option value="nosf">Thiếu ảnh SF</option>
      <option value="beat">▶ Nhịp không thoại</option>
      <option value="talk">💬 Cảnh có thoại</option>
    </select>
    <button id="vbulk" style="display:none" title="Tạo lại toàn bộ video đang hiện sau bộ lọc"></button>
    <button id="theme" title="Sáng / Tối">🌙</button>
    <span class="save" id="save"></span>
  </header>

  <!-- NGĂN KÉO HÀNG ĐỢI (bên phải, đóng mở được).
     Trước đây hai nút Huỷ/Dừng nằm trong #lobar, mà #lobar chỉ hiện khi đang tích
     thẻ — nên lúc lô chạy loạn mà không tích gì thì KHÔNG có chỗ nào bấm dừng.
     Ở đây chúng luôn với tới được, và việc được xếp theo ĐOẠN CHAT. -->
  <div id="qdrawer">
    <div class="qhead">
      <b>▤ Hàng đợi</b>
      <span class="hint" id="qtom"></span>
      <span style="flex:1"></span>
      <button class="sm" onclick="toggleQueue(false)" title="Đóng">✕</button>
    </div>
    <!-- HAI TAB: việc đang sống · sổ việc đã xong. Trộn chung thì danh sách đã
         xong dài dần và đẩy phần đang chạy xuống dưới màn hình. -->
    <div class="qtabs">
      <button id="qtab-live" class="on" onclick="qTab('live')">⏳ Đang chạy &amp; chờ <i id="qn-live"></i></button>
      <button id="qtab-done" onclick="qTab('done')">✓ Đã xong <i id="qn-done"></i></button>
      <span style="flex:1"></span>
      <button class="sm" id="qclear" onclick="xoaXong()" style="display:none"
        title="Dọn sổ việc đã xong. Chỉ xoá dòng theo dõi — ảnh và nhật ký lượt vẫn nguyên.">🗑 Clear</button>
    </div>
    <div class="qacts" id="qbulk" style="display:none">
      <b id="qseln" style="font-size:12.5px"></b>
      <span style="flex:1"></span>
      <button class="sm bad-b" onclick="xuLyDaChon()"
        title="Đang chạy → dừng · đang chờ → huỷ · dòng lỗi → dọn. Chrome KHÔNG bị đóng.">Dừng/huỷ đã chọn</button>
      <button class="sm" onclick="qBoChon()">Bỏ chọn</button>
    </div>
    <div class="qacts">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"
        title="Chọn mọi việc đang hiện trong danh sách">
        <input type="checkbox" id="qall" onclick="qChonHet(this.checked)"> tất cả</label>
      <button class="sm bad-b" onclick="huyHang()"
        title="Vứt các việc CHƯA chạy khỏi hàng đợi. Việc đang chạy vẫn để chạy nốt.">Huỷ việc đang chờ</button>
      <button class="sm" id="qdon" onclick="xoaLoi(null)"
        title="Dọn mọi dòng lỗi khỏi danh sách — không đụng ảnh hay prompt">Dọn lỗi</button>
      <button class="sm bad-b" onclick="dungHet()"
        title="DỪNG HẲN: tắt auto, vét hàng đợi, ĐÓNG Chrome — đóng Chrome là cách duy nhất cắt được việc đang render dở.">⏹
        Dừng tất cả</button>
    </div>
    <div id="qbody"></div>
  </div>
  <button id="qfab" onclick="toggleQueue()" title="Hàng đợi — luôn hiện khi cuộn trang">☰<i class="qn"
      id="qfabn"></i></button>
  <nav id="snav"></nav>
  <main>
    <div class="toolbar">
      <button onclick="chayHetPhim()" id="allbtn"
        title="Bật 'Chạy hết' cho mọi scene còn thiếu ảnh — KHÔNG gồm REF (REF có nút Chạy hết riêng).&#10;Board tự chia task ≤10 ảnh cùng địa điểm rồi đẩy lần lượt vào hàng chờ.">▶▶
        Chạy hết phim</button>
      <button onclick="chayHetVideo()" id="vidallbtn" style="display:none"
        title="Xếp MỌI video còn thiếu của cả phim vào hàng đợi.&#10;Bỏ qua dòng đã có video, dòng thiếu prompt và dòng mà ảnh SF chưa vẽ xong.&#10;Mỗi video là một việc riêng — Grok chỉ nhận một ảnh + một prompt mỗi lượt.">🎬
        Chạy hết video</button>
      <button onclick="toggleAutoVid()" id="avbtn"
        title="Vòng quét tự động có được phép xếp việc TẠO VIDEO hay không. Tắt = auto chỉ lo ảnh SF.&#10;Không liên quan nút 'Tạo video' bấm tay — bấm tay lúc nào cũng chạy.">🎞
        Auto video: …</button>
      <button onclick="toggleAccts()" id="acctbtn">⚙ Tài khoản</button>
      <button onclick="toggleQueue()" id="qbtn"
        title="Xem mọi việc đang chạy và đang chờ, xếp theo đoạn chat. Nút dừng nằm trong đây.">▤ Hàng đợi</button>
      <button onclick="toggleLoi()" id="loibtn"
        title="Mọi cảnh báo và lỗi của board — selector chết, lỗi mạng, tab kẹt, job hỏng. Copy cả hộp để gửi đi nhờ sửa.">🐞
        Lỗi <i id="loin"></i></button>
      <span class="hint" id="runstatus" style="color:var(--acc)"></span>
      <div id="lobar">
        <b><span id="lonum">0</span> ảnh đã chọn</b>
        <button class="pri" id="lotao" onclick="loChay()"
          title="Gửi các ảnh đã chọn trong MỘT tin nhắn, vào một chat trắng. Chúng được vẽ cùng lúc nên đồng bộ với nhau.">▶ Tạo ảnh đã chọn</button>
        <button onclick="loBo()" title="Bỏ hết các ảnh đang chọn">Huỷ</button>
      </div>
    </div>
    <div id="acctpanel"
      style="display:none;margin:8px 0;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:10px;background:var(--card,#fff)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <b>Tài khoản Chrome</b>
        <!-- HAI LOẠI TÀI KHOẢN, HAI TAB. Trộn chung một bảng thì cột "hôm nay ·
             cao nhất" của Grok (video, hạn mức khác hẳn) nằm cạnh của ChatGPT
             và đọc như cùng một thang đo. Trần "tối đa N" cũng chỉ áp cho
             ChatGPT, để nó cạnh hàng Grok là mời hiểu nhầm. -->
        <div id="accttabs">
          <button class="atab on" onclick="acctTab('img')" id="atab-img">ChatGPT</button>
          <button class="atab" onclick="acctTab('vid')" id="atab-vid">Grok</button>
        </div>
        <label id="sotkwrap" style="display:flex;align-items:center;gap:5px;font-size:12.5px"
          title="TRẦN số tài khoản ChatGPT chạy đồng thời — chạy ít hơn cũng được, board chỉ tắt bớt khi VƯỢT.&#10;Board không tắt tài khoản đang chạy việc dở: nó chờ việc xong rồi mới tính lại.&#10;Cửa sổ lỗi thì board TẮT nó và BẬT cái kế tiếp trong vòng — đổi danh tính, không đổi số lượng.&#10;Khác 'tab': tab là nhiều việc trong CÙNG một tài khoản, chung một hạn mức.">tối đa
          <input type="number" min="1" max="12" id="sotk" style="width:48px"
            onchange="datSoTK(this.value)"> tài khoản</label>
        <label id="tranrefwrap" style="display:flex;align-items:center;gap:5px;font-size:12.5px"
          title="TRẦN số ảnh tham chiếu (ref) trong MỘT tin nhắn — trần chung cho cả board, không theo tài khoản.&#10;Chạm trần là board chốt lô ngay, dù chưa đủ 10 SF: 6 SF mà đã 10 ref thì lô đó chỉ 6 SF.&#10;Ref dùng chung giữa các SF chỉ tính MỘT lần, nên thêm SF dùng lại ref cũ là miễn phí.&#10;Tràn trần thì nhân vật từ thứ 5 trở đi chỉ gửi ảnh full-body, bỏ ảnh chân dung.&#10;Đo được trên board ALTAR 15/08: lô 5 ref chạy sạch, lô 14-17 ref hỏng mọi lượt và tắt sạch 6 tài khoản.&#10;Ngưỡng thật chưa ai đo — hạ xuống nếu vẫn gặp 'không đính được ảnh ref'.">tối đa
          <input type="number" min="1" max="30" id="tranref" style="width:48px"
            onchange="datTranRef(this.value)"> ref/lô</label>
        <button id="acctadd" onclick="acctAdd(ACCT_TAB)">+ ChatGPT</button>
        <span class="hint">Bật = mở Chrome + đưa vào vòng chạy · Tắt = đóng Chrome + ngừng dùng · login thì bạn tự làm
          trong cửa sổ</span>
      </div>
      <div id="acctrows"></div>
    </div>
    <!-- HỘP LỖI. Nằm trong luồng trang chứ không phải cửa sổ nổi: lỗi thường
         phải đọc song song với thẻ đang hỏng, hộp nổi che mất thẻ. -->
    <div id="loipanel" style="display:none">
      <div class="loihead">
        <b>🐞 Lỗi &amp; cảnh báo</b>
        <span class="hint" id="loimeta"></span>
        <span style="flex:1"></span>
        <label class="hint" title="Chỉ hiện dòng ERROR, giấu WARNING"><input type="checkbox"
            id="loinang" onchange="veLoi()"> chỉ lỗi nặng</label>
        <input id="loitim" placeholder="lọc chữ… (grok, quic, selector)" oninput="veLoi()">
        <button onclick="loiCopy()" id="loicopy" title="Chép toàn bộ (đã lọc) vào clipboard">⧉ Copy</button>
        <button onclick="loiXoa()" class="bad-b" title="Dọn sổ lỗi trên board">🗑 Dọn</button>
        <button onclick="toggleLoi()" title="Đóng hộp">✕</button>
      </div>
      <div id="loibody"></div>
    </div>
    <div id="root"></div>
  </main>

  <dialog id="mall">
    <div class="dlg-h"><b>Tất cả ảnh master của phim</b><span style="flex:1"></span>
      <span id="ma-n" style="opacity:.6;margin-right:10px"></span>
      <button onclick="mall.close()">Đóng</button>
    </div>
    <div id="ma-g"></div>
  </dialog>

  <dialog id="hoibox">
    <div class="dlg-h"><span class="ic" id="hb-ic"></span><b id="hb-t"></b></div>
    <div class="bd" id="hb-m"></div>
    <div class="ft" id="hb-ft"></div>
  </dialog>

  <dialog id="sfpick">
    <div class="dlg-h"><b id="sp-t"></b><span style="flex:1"></span>
      <input id="sp-q" placeholder="lọc theo mã hoặc tên góc…" style="width:230px">
      <button onclick="sfpick.close()">Đóng</button>
    </div>
    <div id="sp-g"></div>
  </dialog>

  <dialog id="lightbox">
    <div class="dlg-h"><b id="lb-t"></b><span style="flex:1"></span>
      <span id="lb-n" style="opacity:.6;margin-right:10px"></span>
      <button id="lb-lui" onclick="lbLui()" style="display:none"
        title="Lùi lần lấy ảnh gần nhất: xoá bản vừa thêm, trả ảnh chính về bản trước đó">↩ Hoàn tác</button>
      <button onclick="lbNav(-1)" title="Ảnh trước (phím ←)">‹</button>
      <button onclick="lbNav(1)" title="Ảnh sau (phím →)">›</button>
      <button onclick="lightbox.close()">Đóng</button>
    </div><img id="lb-i">
    <div id="lb-v"></div>
  </dialog>

  <!-- Hai helper phải nạp TRƯỚC board.js: board.js đọc global ngay dòng đầu. -->
  <script src="/ui/job-request.js"></script>
  <script src="/ui/job-projection.js"></script>
  <script src="/ui/board.js"></script>
</body>

</html>
